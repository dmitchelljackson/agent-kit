name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: uv run python -m unittest discover -s tests -v
      - name: Wiki check
        run: uv run akit check
