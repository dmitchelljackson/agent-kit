[project]
name = "agent-kit"
version = "0.1.0"
description = "An atom-based, git-backed wiki for coding agents: rules, knowledge, tools, bookmarks, and sharing across projects."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
akit = "agent_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_kit"]
